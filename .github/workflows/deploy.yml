name: build-and-deploy

on:
  # 手动触发(Actions 页面 "Run workflow")
  workflow_dispatch:
  # 推送到 main 时构建
  push:
    branches: [main]
  # 定时(UTC): 01:00 = 北京09:00(美股收盘后);
  # 11:30 = 北京19:30(NXT 20:00 KST收盘后留出数据落地缓冲)
  schedule:
    - cron: "0 1 * * *"
    - cron: "30 11 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

# 不取消进行中的部署, 但同一时间只跑一个
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 跨 Actions 运行保留最近一次成功抓取，避免数据源短暂失败时回退到旧种子。
      - name: Restore foreign-flow history
        uses: actions/cache@v4
        with:
          path: data/SK_HYNIX_FOREIGN_FLOW.csv
          key: foreign-flow-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            foreign-flow-v2-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Build static site
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "30 11 * * 1-5" ]]; then
            python -X utf8 build_static.py --strict-flow-freshness
          else
            python -X utf8 build_static.py
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
