<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI硬件股拥挤度日报</title>
<script src="static/chart.umd.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d212b; --line: #2a2f3a;
    --text: #e8eaf0; --muted: #9aa3b2; --dim: #6b7280;
    --green: #34d399; --yellow: #fbbf24; --orange: #fb923c; --red: #f87171; --blue: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--blue); }
  button:disabled { opacity: .5; cursor: wait; }
  .banner { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; display: none; }
  .banner.warn { display: block; background: rgba(251,146,60,.12); color: var(--orange); }

  .cards { display: grid; grid-template-columns: 280px repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 1000px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .card .v { font-size: 26px; font-weight: 700; }
  .card .s { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .tci-card { display: flex; gap: 16px; align-items: center; }
  .tci-num { font-size: 44px; font-weight: 800; line-height: 1.1; }
  .tci-tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .parts { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .c-green { color: var(--green); } .c-yellow { color: var(--yellow); }
  .c-orange { color: var(--orange); } .c-red { color: var(--red); } .c-blue { color: var(--blue); }
  .bg-green { background: rgba(52,211,153,.15); color: var(--green); }
  .bg-yellow { background: rgba(251,191,36,.15); color: var(--yellow); }
  .bg-orange { background: rgba(251,146,60,.15); color: var(--orange); }
  .bg-red { background: rgba(248,113,113,.15); color: var(--red); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .panel .sub { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .chart-box { position: relative; height: 300px; }
  .chart-box.small { height: 260px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: none; }
  .chip { display: inline-block; min-width: 44px; text-align: center; padding: 1px 8px;
          border-radius: 6px; font-weight: 700; }
  .cell-hot { color: var(--red); font-weight: 600; }
  .cell-warm { color: var(--orange); }
  .cell-cool { color: var(--muted); }
  .flag { font-size: 12px; padding: 1px 8px; border-radius: 999px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .playbook { font-size: 13px; color: var(--muted); }
  .playbook b { color: var(--text); }
  .playbook li { margin-bottom: 4px; }
  .err { color: var(--red); padding: 30px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI硬件股拥挤度日报</h1>
    <span class="meta" id="meta">加载中…</span>
    <button id="btnRefresh" onclick="doRefresh()">更新数据</button>
  </header>
  <div class="banner warn" id="banner"></div>
  <div id="app"><div class="err" style="color:var(--muted)">加载中…</div></div>
</div>

<script>
const LV = {
  green:  {name: "绿 · 正常",     cls: "green"},
  yellow: {name: "黄 · 偏热",     cls: "yellow"},
  orange: {name: "橙 · 过热",     cls: "orange"},
  red:    {name: "红 · 拥挤极值", cls: "red"},
  na:     {name: "—",            cls: "green"},
};
const STOCK_COLORS = {MU:"#60a5fa", SNDK:"#f472b6", WDC:"#34d399", SK_HYNIX:"#fbbf24", SAMSUNG:"#a78bfa"};
const STOCK_LABELS = {MU:"美光", SNDK:"闪迪", WDC:"西数", SK_HYNIX:"SK海力士", SAMSUNG:"三星"};
let charts = [];
let IS_STATIC = false;

function fmtPrice(v, cur) {
  const n = v >= 10000 ? v.toLocaleString("en-US", {maximumFractionDigits: 0})
                       : v.toLocaleString("en-US", {maximumFractionDigits: 1});
  return cur + n;
}
function subCell(v, hot=90, warm=75) {
  if (v === null || v === undefined) return "<td class='cell-cool'>—</td>";
  const cls = v >= hot ? "cell-hot" : v >= warm ? "cell-warm" : "cell-cool";
  return `<td class="${cls}">${v.toFixed(0)}</td>`;
}

async function load() {
  let d = null;
  // 静态托管(GitHub Pages): 优先读构建时生成的 dashboard.json
  try {
    const r = await fetch("dashboard.json", { cache: "no-store" });
    if (r.ok) { d = await r.json(); IS_STATIC = true; }
  } catch (e) {}
  // 本地 Flask: 回退到实时接口
  if (!d) {
    try {
      const r = await fetch("/api/dashboard");
      d = await r.json();
    } catch (e) {
      document.getElementById("app").innerHTML = `<div class="err">数据加载失败, 请稍后刷新</div>`;
      return;
    }
  }
  if (d.error) {
    document.getElementById("app").innerHTML = `<div class="err">数据加载失败: ${d.error}<br>请点击"更新数据"重试</div>`;
    return;
  }
  render(d);
}

function render(d) {
  charts.forEach(c => c.destroy()); charts = [];
  const meta = document.getElementById("meta");
  const btn = document.getElementById("btnRefresh");
  const banner = document.getElementById("banner");
  if (d.last_error) { banner.textContent = "提示: " + d.last_error; banner.className = "banner warn"; }
  else banner.className = "banner";
  if (IS_STATIC) {
    meta.textContent = `数据生成于 ${d.generated_at} (UTC) · 每交易日自动更新两次(约北京时间 09:00 / 15:00)`;
    btn.textContent = "刷新页面"; btn.disabled = false;
  } else {
    const age = (d.data_age_min == null) ? "" :
      ` · 数据新鲜度 ${d.data_age_min < 60 ? d.data_age_min + "分钟" : (d.data_age_min/60).toFixed(1) + "小时"}`;
    meta.textContent = `生成 ${d.generated_at}${age}` + (d.last_refresh ? ` · 上次刷新 ${d.last_refresh}` : "");
    btn.disabled = d.refreshing;
    if (d.refreshing) { btn.textContent = "刷新中…"; setTimeout(load, 5000); }
    else btn.textContent = "更新数据";
  }

  const t = d.tci, tl = LV[t.status];
  const app = document.getElementById("app");
  app.innerHTML = `
  <div class="cards">
    <div class="card tci-card">
      <div>
        <div class="k">TCI 主题总指数 (${t.date})</div>
        <div class="tci-num c-${tl.cls}">${t.value.toFixed(1)}</div>
        <span class="tci-tag bg-${tl.cls}">${tl.name.replace(" · ", " ")}</span>
        <div class="parts">强度 ${t.level.toFixed(1)} · 广度 ${t.breadth_pct.toFixed(0)} · 持续 ${t.persistence.toFixed(0)}</div>
      </div>
    </div>
    <div class="card">
      <div class="k">红区标的 (个股分≥85)</div>
      <div class="v ${d.summary.n_red > 0 ? "c-red" : "c-green"}">${d.summary.n_red} / 5</div>
      <div class="s">广度(≥80分): ${d.summary.breadth} / 5</div>
    </div>
    <div class="card">
      <div class="k">触发减仓 (红区武装+破MA20)</div>
      <div class="v ${d.summary.n_triggered > 0 ? "c-orange" : "c-green"}">${d.summary.n_triggered} / 5</div>
      <div class="s">站回MA20且分数<60才解除</div>
    </div>
    <div class="card">
      <div class="k">波动余震指标 (波动率分位均值)</div>
      <div class="v ${d.vol_pct_now >= 90 ? "c-red" : d.vol_pct_now >= 80 ? "c-orange" : "c-green"}">${d.vol_pct_now.toFixed(0)}</div>
      <div class="s">${d.vol_pct_now >= 90 ? "余震进行中, 勿抄底正股" : d.vol_pct_now >= 80 ? "波动仍高, 谨慎" : "余震平息, 第二批加仓窗口"}</div>
    </div>
    <div class="card">
      <div class="k">TCI 近6个交易日</div>
      <div class="v" style="font-size:18px; font-weight:600">${t.recent.map(x => x.value.toFixed(0)).join(" → ")}</div>
      <div class="s">${t.recent[0].date} → ${t.recent[t.recent.length-1].date}</div>
    </div>
  </div>

  <div class="panel">
    <h2>个股拥挤度明细</h2>
    <div class="sub">综合分 = 成交热度15% + 成交占比10% + 均线偏离20% + 动量15% + RSI10% + 波动15% + 篮子相关15% · 子指标为滚动2年百分位(0-100)</div>
    <div style="overflow-x:auto"><table>
      <tr><th>标的</th><th>日期</th><th>收盘</th><th>涨跌</th><th>综合分</th><th>状态</th>
          <th>成交热度</th><th>成交占比</th><th>均线偏离</th><th>动量</th><th>RSI</th><th>波动</th><th>篮子相关</th>
          <th>波动率(年化)</th><th>距250日高点</th><th>信号</th></tr>
      ${d.stocks.map(s => {
        const l = LV[s.status];
        const chg = s.chg_pct === null ? "—" :
          `<span class="${s.chg_pct >= 0 ? "c-red" : "c-green"}">${s.chg_pct >= 0 ? "+" : ""}${s.chg_pct.toFixed(2)}%</span>`;
        const flags = [];
        if (s.triggered) flags.push('<span class="flag bg-red">触发减仓</span>');
        else if (s.armed) flags.push('<span class="flag bg-orange">红区武装</span>');
        if (s.below_ma20) flags.push('<span class="flag bg-yellow">破MA20</span>');
        const rv = s.rv20 === null ? "—" :
          `<span class="${(s.subs.volatility ?? 0) >= 90 ? "cell-hot" : ""}">${s.rv20.toFixed(0)}%</span>` +
          `<span class="cell-cool" style="font-size:11px"> /中位${s.rv_1y_med === null ? "—" : s.rv_1y_med.toFixed(0)}</span>`;
        return `<tr>
          <td><b>${s.label}</b></td><td class="cell-cool">${s.date.slice(5)}</td>
          <td>${fmtPrice(s.close, s.cur)}</td><td>${chg}</td>
          <td><span class="chip bg-${l.cls}">${s.score === null ? "—" : s.score.toFixed(1)}</span></td>
          <td class="c-${l.cls}" style="text-align:left">${l.name}</td>
          ${subCell(s.subs.turnover)}${subCell(s.subs.vol_share)}${subCell(s.subs.extension)}
          ${subCell(s.subs.momentum)}${subCell(s.subs.rsi, 75, 65)}${subCell(s.subs.volatility)}
          ${subCell(s.subs.basket_corr, 80, 70)}
          <td>${rv}</td>
          <td>${s.dd_from_high === null ? "—" : s.dd_from_high.toFixed(1) + "%"}</td>
          <td style="text-align:left">${flags.join(" ") || '<span class="cell-cool">—</span>'}</td>
        </tr>`;
      }).join("")}
    </table></div>
  </div>

  <div class="panel">
    <h2>TCI 主题总指数走势 (近一年)</h2>
    <div class="sub">TCI = 0.45×强度 + 0.30×广度 + 0.25×持续 · ≥80红区: 历史上20日内主题回撤≥10%概率61% · 数据源: 新浪/Naver日线 · 点图例可叠加各标的价格(起点=100, 右轴)</div>
    <div class="chart-box"><canvas id="tciChart"></canvas></div>
  </div>

  <div class="panel">
    <h2>五标的综合拥挤度分数 (近9个月)</h2>
    <div class="sub">85 = 个股红区(建保护/collar) · 75 = 橙区(停止加仓, 趁IV低买put spread)</div>
    <div class="chart-box small"><canvas id="scoreChart"></canvas></div>
  </div>

  <div class="panel">
    <h2>波动率监测</h2>
    <div class="sub">左: 20日已实现波动率(年化%, 高位放量+波动抬升=顶部末段; 崩盘后维持高位=余震) ·
      右: 五标的波动率历史分位均值, <span class="c-green">跌破80 = 余震平息, 是第二批加仓的量化条件</span></div>
    <div class="grid2">
      <div class="chart-box small"><canvas id="rvChart"></canvas></div>
      <div class="chart-box small"><canvas id="volPctChart"></canvas></div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel" style="margin-bottom:0">
      <h2>期权维度快照 (CBOE延迟报价)</h2>
      <div class="sub">skew收敛至>-3%且P/C(量)<0.7 = call投机拥挤; 分数红+IV低 = 买保护黄金窗口</div>
      ${d.options.length ? `<table>
        <tr><th>标的</th><th>现价</th><th>ATM IV</th><th>IV/RV</th><th>skew(C−P)</th><th>P/C量</th><th>P/C持仓</th></tr>
        ${d.options.map(o => {
          const st = d.stocks.find(s => s.key === o.ticker);
          const ivrv = (st && st.rv20 && o.near_atm_iv_pct) ? o.near_atm_iv_pct / st.rv20 : null;
          const ivrvCell = ivrv === null ? "—" :
            `<span class="${ivrv >= 1.3 ? "c-yellow" : ivrv <= 0.9 ? "c-blue" : ""}">${ivrv.toFixed(2)}</span>`;
          return `<tr>
          <td><b>${o.ticker}</b> <span class="cell-cool" style="font-size:11px">${o.asof.slice(5)}</span></td>
          <td>$${o.spot != null ? o.spot.toFixed(1) : "—"}</td>
          <td class="${(o.near_atm_iv_pct ?? 0) >= 80 ? "cell-hot" : ""}">${o.near_atm_iv_pct ?? "—"}%</td>
          <td>${ivrvCell}</td>
          <td class="${(o.skew_call_minus_put_pct ?? -99) > -3 ? "cell-hot" : "cell-cool"}">${o.skew_call_minus_put_pct ?? "—"}%</td>
          <td class="${(o.pc_ratio_vol ?? 9) < 0.7 ? "cell-hot" : ""}">${o.pc_ratio_vol ?? "—"}</td>
          <td>${o.pc_ratio_oi ?? "—"}</td>
        </tr>`;}).join("")}
      </table>
      <div class="sub" style="margin:8px 0 0">IV/RV >1.3 期权贵(利于卖put建仓/卖call增强) · <0.9 期权便宜(利于买保护)</div>`
      : '<div class="cell-cool">暂无期权数据, 点击"更新数据"获取</div>'}
    </div>
    <div class="panel" style="margin-bottom:0">
      <h2>操作对照表</h2>
      <ul class="playbook">
        <li><b>个股 60-75 黄:</b> 持有不追高, 开始盯IV与skew</li>
        <li><b>个股 75-85 橙:</b> 停止加仓; IV低位时买3个月5-10% OTM put spread</li>
        <li><b>个股 ≥85 红:</b> collar(卖5-8% OTM call + 买10% OTM put)或减仓20-30%</li>
        <li><b>TCI ≥80 主题红:</b> 全篮子降杠杆, 用SOXX/DRAM put做指数对冲</li>
        <li><b>红区武装+破MA20:</b> 机械减至半仓, 站回MA20且分数<60才恢复</li>
        <li><b>再进场:</b> 第一批=TCI<55且站回MA20; 第二批=波动分位均值<80(余震平息)或站稳MA50</li>
        <li><b>纪律:</b> 拥挤≠立刻跌(首红后40日最大涨幅中位数+16%), 只做保护不做反向; 保护要买在IV起飞前</li>
      </ul>
    </div>
  </div>`;

  drawTci(t);
  drawScores(d.score_chart);
  drawRv(d.rv_chart);
  drawVolPct(d.vol_pct_chart);
}

function hline(v, color, label) {
  return {
    label, data: [], borderColor: color, borderWidth: 1, borderDash: [6, 4],
    pointRadius: 0, fill: false, _hline: v,
  };
}

function drawTci(t) {
  const ctx = document.getElementById("tciChart");
  const vals = t.chart.values;
  const colors = vals.map(v => v >= 80 ? "#f87171" : v >= 70 ? "#fb923c" : v >= 55 ? "#fbbf24" : "#60a5fa");
  const datasets = [
    { label: "TCI", data: vals, borderColor: "#fb923c", backgroundColor: "rgba(251,146,60,.08)",
      fill: true, pointRadius: 0, borderWidth: 1.8, tension: .2, segment: {
        borderColor: c => colors[c.p1DataIndex],
      }},
    { label: "红区 80", data: vals.map(() => 80), borderColor: "rgba(248,113,113,.6)",
      borderWidth: 1, borderDash: [6,4], pointRadius: 0, fill: false },
    { label: "黄区 55", data: vals.map(() => 55), borderColor: "rgba(251,191,36,.45)",
      borderWidth: 1, borderDash: [6,4], pointRadius: 0, fill: false },
  ];
  // 各标的价格曲线(起点归一化=100, 右轴), 默认隐藏, 点图例开启
  const prices = t.chart.prices || {};
  const hasPrices = Object.keys(prices).length > 0;
  for (const k of Object.keys(prices)) {
    datasets.push({
      label: (STOCK_LABELS[k] || k) + " 价格", data: prices[k], yAxisID: "y1", hidden: true,
      borderColor: STOCK_COLORS[k] || "#999", pointRadius: 0, borderWidth: 1.3,
      tension: .2, spanGaps: true, fill: false,
    });
  }
  const opts = baseOpts(0, 100);
  if (hasPrices) {
    // 对数轴: SNDK等标的一年涨幅达数十倍, 线性轴会压扁其他曲线
    opts.scales.y1 = {
      type: "logarithmic", position: "right",
      ticks: { color: "#6b7280", callback: v => {
        const ok = [100, 200, 500, 1000, 2000, 5000, 10000];
        return ok.includes(v) ? v : null;
      }},
      grid: { drawOnChartArea: false },
      title: { display: true, text: "价格(起点=100, 对数轴)", color: "#6b7280", font: {size: 11} },
    };
  }
  charts.push(new Chart(ctx, {
    type: "line",
    data: { labels: t.chart.dates, datasets },
    options: opts,
  }));
}

function drawScores(sc) {
  const ctx = document.getElementById("scoreChart");
  const ds = Object.keys(sc.series).map(k => ({
    label: k, data: sc.series[k], borderColor: STOCK_COLORS[k] || "#999",
    pointRadius: 0, borderWidth: 1.6, tension: .2, spanGaps: true, fill: false,
  }));
  ds.push({ label: "红区 85", data: sc.dates.map(() => 85), borderColor: "rgba(248,113,113,.6)",
            borderWidth: 1, borderDash: [6,4], pointRadius: 0, fill: false });
  charts.push(new Chart(ctx, {
    type: "line",
    data: { labels: sc.dates, datasets: ds },
    options: baseOpts(30, 100),
  }));
}

function drawRv(rc) {
  const ctx = document.getElementById("rvChart");
  const ds = Object.keys(rc.series).map(k => ({
    label: k, data: rc.series[k], borderColor: STOCK_COLORS[k] || "#999",
    pointRadius: 0, borderWidth: 1.6, tension: .2, spanGaps: true, fill: false,
  }));
  const opts = baseOpts(0, undefined);
  opts.plugins.title = { display: true, text: "20日已实现波动率 (年化%)", color: "#9aa3b2", font: {size: 12} };
  charts.push(new Chart(ctx, { type: "line", data: { labels: rc.dates, datasets: ds }, options: opts }));
}

function drawVolPct(vc) {
  const ctx = document.getElementById("volPctChart");
  const opts = baseOpts(0, 100);
  opts.plugins.title = { display: true, text: "波动率历史分位·五标的均值 (余震指标)", color: "#9aa3b2", font: {size: 12} };
  charts.push(new Chart(ctx, {
    type: "line",
    data: { labels: vc.dates, datasets: [
      { label: "波动分位均值", data: vc.values, borderColor: "#a78bfa",
        backgroundColor: "rgba(167,139,250,.08)", fill: true, pointRadius: 0, borderWidth: 1.8, tension: .2 },
      { label: "余震线 80", data: vc.values.map(() => 80), borderColor: "rgba(52,211,153,.55)",
        borderWidth: 1, borderDash: [6,4], pointRadius: 0, fill: false },
    ]},
    options: opts,
  }));
}

function baseOpts(min, max) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { labels: { color: "#9aa3b2", boxWidth: 18, boxHeight: 2 } },
      tooltip: { backgroundColor: "#1d212b", borderColor: "#2a2f3a", borderWidth: 1 },
    },
    scales: {
      x: { ticks: { color: "#6b7280", maxTicksLimit: 14, maxRotation: 0 }, grid: { color: "rgba(42,47,58,.5)" } },
      y: { min, max, ticks: { color: "#6b7280" }, grid: { color: "rgba(42,47,58,.5)" } },
    },
  };
}

async function doRefresh() {
  if (IS_STATIC) { location.reload(); return; }  // 静态站点由GitHub Actions定时更新
  const btn = document.getElementById("btnRefresh");
  btn.disabled = true; btn.textContent = "刷新中…";
  await fetch("/api/refresh", { method: "POST" });
  setTimeout(load, 5000);
}

load();
</script>
