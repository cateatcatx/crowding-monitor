<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI硬件股拥挤度日报</title>
<script src="static/chart.umd.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d212b; --line: #2a2f3a;
    --text: #e8eaf0; --muted: #9aa3b2; --dim: #6b7280;
    --green: #34d399; --yellow: #fbbf24; --orange: #fb923c; --red: #f87171; --blue: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--blue); }
  button:disabled { opacity: .5; cursor: wait; }
  .banner { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; display: none; }
  .banner.warn { display: block; background: rgba(251,146,60,.12); color: var(--orange); }

  .cards { display: grid; grid-template-columns: 280px repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 1000px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .card .v { font-size: 26px; font-weight: 700; }
  .card .s { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .tci-card { display: flex; gap: 16px; align-items: center; }
  .tci-num { font-size: 44px; font-weight: 800; line-height: 1.1; }
  .tci-tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .parts { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .c-green { color: var(--green); } .c-yellow { color: var(--yellow); }
  .c-orange { color: var(--orange); } .c-red { color: var(--red); } .c-blue { color: var(--blue); }
  .bg-green { background: rgba(52,211,153,.15); color: var(--green); }
  .bg-yellow { background: rgba(251,191,36,.15); color: var(--yellow); }
  .bg-orange { background: rgba(251,146,60,.15); color: var(--orange); }
  .bg-red { background: rgba(248,113,113,.15); color: var(--red); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .panel .sub { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .chart-box { position: relative; height: 300px; }
  .chart-box.small { height: 260px; }
  .chart-box.flow-chart { height: 320px; }
  .rotation-toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .rotation-toolbar button[aria-pressed="true"] { border-color:var(--blue); color:var(--blue); }
  #rotationPanel .sub { color:var(--muted); }
  .flow-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
               margin: 12px 0 14px; }
  .flow-kpi { background: var(--panel2); border: 1px solid var(--line);
              border-radius: 8px; padding: 10px 12px; }
  .flow-kpi .k { color: var(--muted); font-size: 12px; }
  .flow-kpi .v { font-size: 20px; font-weight: 700; margin-top: 2px;
                 overflow-wrap: anywhere; }
  .flow-kpi .s { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .flow-status { display: inline-block; margin-left: 6px; padding: 1px 7px;
                 border-radius: 999px; font-size: 11px; font-weight: 600; }
  .flow-details { margin-top: 12px; }
  .flow-details summary { color: var(--muted); cursor: pointer; font-size: 12px;
                          user-select: none; }
  .flow-details table { margin-top: 7px; }
  .source-link { color: var(--blue); text-decoration: none; }
  .source-link:hover { text-decoration: underline; }
  @media (max-width: 760px) {
    .flow-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chart-box.flow-chart { height: 280px; }
  }
  @media (max-width: 480px) {
    .flow-kpis { grid-template-columns: 1fr; }
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: none; }
  .chip { display: inline-block; min-width: 44px; text-align: center; padding: 1px 8px;
          border-radius: 6px; font-weight: 700; }
  .cell-hot { color: var(--red); font-weight: 600; }
  .cell-warm { color: var(--orange); }
  .cell-cool { color: var(--muted); }
  .flag { font-size: 12px; padding: 1px 8px; border-radius: 999px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .playbook { font-size: 13px; color: var(--muted); }
  .playbook b { color: var(--text); }
  .playbook li { margin-bottom: 4px; }
  .err { color: var(--red); padding: 30px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI硬件股拥挤度日报</h1>
    <span class="meta" id="meta">加载中…</span>
    <button id="btnRefresh" onclick="doRefresh()">更新数据</button>
  </header>
  <div class="banner warn" id="banner"></div>
  <div id="app"><div class="err" style="color:var(--muted)">加载中…</div></div>
</div>

<script>
const LV = {
  green:  {name: "绿 · 正常",     cls: "green"},
  yellow: {name: "黄 · 偏热",     cls: "yellow"},
  orange: {name: "橙 · 过热",     cls: "orange"},
  red:    {name: "红 · 拥挤极值", cls: "red"},
  na:     {name: "—",            cls: "green"},
};
const STOCK_COLORS = {MU:"#60a5fa", SNDK:"#f472b6", WDC:"#34d399", SK_HYNIX:"#fbbf24", SAMSUNG:"#a78bfa", SKHY:"#fbbf24"};
const STOCK_LABELS = {MU:"美光", SNDK:"闪迪", WDC:"西数", SK_HYNIX:"SK海力士", SAMSUNG:"三星", SKHY:"海力士ADR"};
const RV_KEY = {SKHY: "SK_HYNIX"};  // ADR期权对应韩股正股的已实现波动率
let charts = [];
let rotationCharts = [], rotationData = null, rotationMonths = 3;
let IS_STATIC = false;

function fmtPrice(v, cur) {
  const n = v >= 10000 ? v.toLocaleString("en-US", {maximumFractionDigits: 0})
                       : v.toLocaleString("en-US", {maximumFractionDigits: 1});
  return cur + n;
}
function finiteNumber(v) {
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  if (typeof v === "string" && v.trim() !== "") {
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }
  return null;
}
function escapeHtml(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function safeHttpsUrl(v) {
  try {
    const url = new URL(String(v));
    return url.protocol === "https:" ? escapeHtml(url.href) : "#";
  } catch (e) {
    return "#";
  }
}
function flowClass(v) {
  const n = finiteNumber(v);
  return n > 0 ? "c-red" : n < 0 ? "c-green" : "cell-cool";
}
function fmtSignedShares(v) {
  const n = finiteNumber(v);
  if (n === null) return "—";
  const sign = n > 0 ? "+" : "";
  return `${sign}${n.toLocaleString("en-US")} 股`;
}
function fmtFlowPct(v) {
  const n = finiteNumber(v);
  return n === null ? "—" : n.toFixed(2) + "%";
}
function renderRecentFlowRow(raw, combined) {
  const r = raw && typeof raw === "object" ? raw : {};
  if (!combined) {
    const close = finiteNumber(r.close_krw);
    return `<tr>
      <td>${escapeHtml(r.date || "—")}</td>
      <td class="${flowClass(r.foreign_net_shares)}">${fmtSignedShares(r.foreign_net_shares)}</td>
      <td class="${flowClass(r.institution_net_shares)}">${fmtSignedShares(r.institution_net_shares)}</td>
      <td>${fmtFlowPct(r.holding_ratio_pct)}</td>
      <td>₩${close === null ? "—" : close.toLocaleString("en-US")}</td>
    </tr>`;
  }
  const total = r.total_net_shares ?? r.foreign_net_shares;
  return `<tr>
    <td>${escapeHtml(r.date || "—")}</td>
    <td class="${flowClass(total)}">${fmtSignedShares(total)}</td>
    <td class="${flowClass(r.krx_net_shares)}">${fmtSignedShares(r.krx_net_shares)}</td>
    <td class="${flowClass(r.nxt_net_shares)}">${fmtSignedShares(r.nxt_net_shares)}</td>
    <td>${fmtFlowPct(r.holding_ratio_pct)}</td>
  </tr>`;
}
function flowVenueText(venues, field) {
  const krx = venues && venues.KRX && typeof venues.KRX === "object"
    ? venues.KRX[field] : null;
  const nxt = venues && venues.NXT && typeof venues.NXT === "object"
    ? venues.NXT[field] : null;
  return `KRX ${fmtSignedShares(krx)} · NXT ${fmtSignedShares(nxt)}`;
}
function renderForeignFlowPanel(f) {
  if (!f || typeof f !== "object") return "";
  const recent = Array.isArray(f.recent) ? f.recent : [];
  const venues = f.venues && typeof f.venues === "object" ? f.venues :
    (f.breakdown && typeof f.breakdown === "object" ? f.breakdown : {});
  const combined = String(f.market || "").toUpperCase() === "ALL";
  const ratioChange = finiteNumber(f.holding_ratio_change_pp);
  const ratioChangeText = ratioChange === null ? "较前日 —" :
    `较前日 ${ratioChange > 0 ? "+" : ""}${ratioChange.toFixed(2)}个百分点`;
  const market = escapeHtml(f.market_label ||
    (combined ? "全市场（KRX+NXT）" : f.market || "KRX"));
  const asof = escapeHtml(f.asof || "—");
  const quoteAsOf = escapeHtml(f.quote_asof || "当日");
  const updateTime = escapeHtml(f.expected_update_beijing || "19:30");
  const source = escapeHtml(f.source || "Naver Finance");
  const sourceUrl = safeHttpsUrl(f.source_url);
  const latestNet = finiteNumber(f.latest_net_shares);
  const sum5 = finiteNumber(f.sum_5d_net_shares);
  const sum20 = finiteNumber(f.sum_20d_net_shares);
  const status = f.stale
    ? `<span class="flow-status bg-yellow">等待 ${quoteAsOf} 日终数据</span>`
    : '<span class="flow-status bg-green">已更新</span>';
  const componentStatus = !combined ? "" :
    (f.latest_component_ok
      ? '<span class="flow-status bg-green">ALL=KRX+NXT 已核验</span>'
      : '<span class="flow-status bg-yellow">分市场数据待核验</span>');
  const scopeText = combined
    ? "主指标为 ALL 全市场合计，分项为 KRX 与 NXT"
    : "当前为 KRX 单市场口径";
  const latestSub = combined
    ? flowVenueText(venues, "latest_net_shares")
    : asof;
  const sum5Sub = combined
    ? flowVenueText(venues, "sum_5d_net_shares")
    : "观察短线外资方向";
  const sum20Sub = combined
    ? flowVenueText(venues, "sum_20d_net_shares")
    : "约一个交易月";
  const detailHeader = combined
    ? "<tr><th>日期</th><th>ALL 合计</th><th>KRX</th><th>NXT</th><th>外资持股比例</th></tr>"
    : "<tr><th>日期</th><th>外资净买卖</th><th>机构净买卖</th><th>外资持股比例</th><th>收盘价</th></tr>";
  return `
  <div class="panel">
    <h2>SK海力士外资流向（${market}）${status}${componentStatus}</h2>
    <div class="sub">截至 ${asof} · ${scopeText} · 正值=外资净买入，负值=外资净卖出 · 日终股数口径，不等同精确韩元资金流 ·
      通常北京时间 ${updateTime} 后更新 ·
      <a class="source-link" href="${sourceUrl}" target="_blank" rel="noopener">数据源：${source}</a>
    </div>
    <div class="flow-kpis">
      <div class="flow-kpi">
        <div class="k">最新交易日净买卖</div>
        <div class="v ${flowClass(latestNet)}">${fmtSignedShares(latestNet)}</div>
        <div class="s">${latestSub}</div>
      </div>
      <div class="flow-kpi">
        <div class="k">近 5 个交易日累计</div>
        <div class="v ${flowClass(sum5)}">${fmtSignedShares(sum5)}</div>
        <div class="s">${sum5Sub}</div>
      </div>
      <div class="flow-kpi">
        <div class="k">近 20 个交易日累计</div>
        <div class="v ${flowClass(sum20)}">${fmtSignedShares(sum20)}</div>
        <div class="s">${sum20Sub}</div>
      </div>
      <div class="flow-kpi">
        <div class="k">外资持股比例</div>
        <div class="v c-blue">${fmtFlowPct(f.latest_holding_ratio_pct)}</div>
        <div class="s">${ratioChangeText}</div>
      </div>
    </div>
    <div class="chart-box flow-chart"><canvas id="foreignFlowChart"></canvas></div>
    ${recent.length ? `<details class="flow-details">
      <summary>查看最近 10 个交易日明细</summary>
      <div style="overflow-x:auto"><table>
        ${detailHeader}
        ${recent.map(row => renderRecentFlowRow(row, combined)).join("")}
      </table></div>
    </details>` : ""}
  </div>`;
}
function subCell(v, hot=90, warm=75) {
  if (v === null || v === undefined) return "<td class='cell-cool'>—</td>";
  const cls = v >= hot ? "cell-hot" : v >= warm ? "cell-warm" : "cell-cool";
  return `<td class="${cls}">${v.toFixed(0)}</td>`;
}

function fmtRotationPct(value) {
  const n = finiteNumber(value);
  return n === null ? "—" : `${n > 0 ? "+" : ""}${n.toFixed(2)}%`;
}

function renderRotationPanel(r) {
  if (!r || !r.available || !r.series || !r.summary) {
    return `<section class="panel" id="rotationPanel"><h2>半导体 / 软件轮动 · SOXX / IGV</h2>
      <div class="sub">${escapeHtml(r?.error || "暂无配对数据，更新数据后显示。")}</div></section>`;
  }
  const s = r.summary;
  const maState = value => value === null ? "样本不足" : value ? "上方" : "下方";
  return `<section class="panel" id="rotationPanel">
    <h2>半导体 / 软件轮动 · SOXX / IGV</h2>
    <div class="sub">截至 ${escapeHtml(r.asof)} · 来源：${escapeHtml(r.source)} · ${escapeHtml(r.basis)}。
      比值上升=半导体相对更强，下降=软件相对更强；不计入TCI，不作为独立买卖信号。
      ${r.stale ? '<span class="c-orange">距数据日超过4个自然日，请核对休市安排或刷新状态。</span>' : ''}</div>
    <div class="flow-kpis">
      <div class="flow-kpi"><div class="k">最新价格比值</div><div class="v c-blue">${finiteNumber(s.ratio)?.toFixed(4) ?? '—'}</div>
        <div class="s">20日均线${maState(s.above_ma20)} · 60日均线${maState(s.above_ma60)}</div></div>
      ${[5,20,60].map(n => `<div class="flow-kpi"><div class="k">近 ${n} 个交易日相对涨跌幅</div>
        <div class="v">${fmtRotationPct(s[`change_${n}d_pct`])}</div>
        <div class="s">比值变化，非两ETF收益率之差</div></div>`).join('')}
    </div>
    <div class="rotation-toolbar" role="group" aria-label="轮动图时间范围">
      <button type="button" onclick="setRotationWindow(3)" data-rotation-months="3" aria-pressed="${rotationMonths===3}">近3个月</button>
      <button type="button" onclick="setRotationWindow(12)" data-rotation-months="12" aria-pressed="${rotationMonths===12}">近1年</button>
      <span class="meta" id="rotationRange"></span>
    </div>
    <div class="sub">上图：RS = (SOXX/IGV) ÷ 基准日比值 × 100，基准日 ${escapeHtml(r.base_date)}；均线使用完整历史计算。
      下图：两ETF在所选窗口各自以100起步。点击图例可隐藏曲线。</div>
    <div class="chart-box small"><canvas id="rotationRatioChart" role="img" aria-label="SOXX相对IGV强度及20、60日均线"></canvas></div>
    <div class="chart-box small"><canvas id="rotationPricesChart" role="img" aria-label="SOXX和IGV归一化价格走势"></canvas></div>
  </section>`;
}

function setRotationWindow(months) {
  rotationMonths = months === 12 ? 12 : 3;
  document.querySelectorAll('[data-rotation-months]').forEach(button => {
    button.setAttribute('aria-pressed', String(Number(button.dataset.rotationMonths) === rotationMonths));
  });
  drawRotation(rotationData);
}

function drawRotation(r) {
  rotationCharts.forEach(chart => chart.destroy());
  charts = charts.filter(chart => !rotationCharts.includes(chart));
  rotationCharts = [];
  if (!r?.available || !r.series?.dates?.length || !document.getElementById('rotationRatioChart')) return;
  const series = r.series;
  const cutoff = new Date(series.dates.at(-1) + 'T00:00:00Z');
  cutoff.setUTCMonth(cutoff.getUTCMonth() - rotationMonths);
  const start = rotationMonths === 12 ? 0 : series.dates.findIndex(date => date >= cutoff.toISOString().slice(0,10));
  const offset = Math.max(0, start), dates = series.dates.slice(offset);
  document.getElementById('rotationRange').textContent = `${dates[0]} — ${dates.at(-1)} · ${dates.length}个共同交易日`;
  const dataset = (label, values, color, dash=[]) => ({label, data:values, borderColor:color,
    borderDash:dash, borderWidth:1.7, pointRadius:0, pointHoverRadius:4, tension:0, spanGaps:false});
  const options = title => {
    const opts = baseOpts(undefined, undefined);
    opts.scales.y.title = {display:true, text:title, color:'#9aa3b2'};
    opts.scales.x.title = {display:true, text:'美国交易日', color:'#9aa3b2'};
    opts.scales.x.ticks.maxTicksLimit = window.innerWidth < 600 ? 4 : 10;
    opts.scales.x.ticks.callback = function(value) {return this.getLabelForValue(value).slice(2);};
    opts.plugins.tooltip.callbacks = {label:c=>`${c.dataset.label}: ${finiteNumber(c.raw)?.toFixed(2) ?? '—'}`};
    return opts;
  };
  const ratio = new Chart(document.getElementById('rotationRatioChart'), {type:'line', data:{labels:dates, datasets:[
    dataset('SOXX / IGV 相对强度', series.index.slice(offset), '#60a5fa'),
    dataset('20日均线', series.ma20.slice(offset), '#34d399', [5,3]),
    dataset('60日均线', series.ma60.slice(offset), '#fbbf24', [3,3]),
  ]}, options:options('相对强度指数（基准日=100）')});
  const prices = new Chart(document.getElementById('rotationPricesChart'), {type:'line', data:{labels:dates, datasets:[
    dataset('SOXX 半导体', series.soxx.slice(offset).map(v=>v/series.soxx[offset]*100), '#60a5fa'),
    dataset('IGV 软件', series.igv.slice(offset).map(v=>v/series.igv[offset]*100), '#f472b6'),
  ]}, options:options('价格指数（窗口起点=100）')});
  rotationCharts = [ratio, prices]; charts.push(...rotationCharts);
}

async function load() {
  let d = null;
  // 静态托管(GitHub Pages): 优先读构建时生成的 dashboard.json
  try {
    const r = await fetch("dashboard.json", { cache: "no-store" });
    if (r.ok) { d = await r.json(); IS_STATIC = true; }
  } catch (e) {}
  // 本地 Flask: 回退到实时接口
  if (!d) {
    try {
      const r = await fetch("/api/dashboard");
      d = await r.json();
    } catch (e) {
      document.getElementById("app").innerHTML = `<div class="err">数据加载失败, 请稍后刷新</div>`;
      return;
    }
  }
  if (d.error) {
    document.getElementById("app").innerHTML = `<div class="err">数据加载失败: ${d.error}<br>请点击"更新数据"重试</div>`;
    return;
  }
  render(d);
}

function render(d) {
  charts.forEach(c => c.destroy()); charts = [];
  rotationCharts = []; rotationData = d.relative_strength;
  const meta = document.getElementById("meta");
  const btn = document.getElementById("btnRefresh");
  const banner = document.getElementById("banner");
  if (d.last_error) { banner.textContent = "提示: " + d.last_error; banner.className = "banner warn"; }
  else banner.className = "banner";
  if (IS_STATIC) {
    meta.textContent = `数据生成于 ${d.generated_at} (UTC) · 每交易日自动更新两次(约北京时间 09:00 / 19:30)`;
    btn.textContent = "刷新页面"; btn.disabled = false;
  } else {
    const age = (d.data_age_min == null) ? "" :
      ` · 数据新鲜度 ${d.data_age_min < 60 ? d.data_age_min + "分钟" : (d.data_age_min/60).toFixed(1) + "小时"}`;
    meta.textContent = `生成 ${d.generated_at}${age}` + (d.last_refresh ? ` · 上次刷新 ${d.last_refresh}` : "");
    btn.disabled = d.refreshing;
    if (d.refreshing) { btn.textContent = "刷新中…"; setTimeout(load, 5000); }
    else btn.textContent = "更新数据";
  }

  const t = d.tci, tl = LV[t.status];
  const app = document.getElementById("app");
  app.innerHTML = `
  <div class="cards">
    <div class="card tci-card">
      <div>
        <div class="k">TCI 主题总指数 (${t.date})</div>
        <div class="tci-num c-${tl.cls}">${t.value.toFixed(1)}</div>

function hline(v, color, label) {
  return {
    label, data: [], borderColor: color, borderWidth: 1, borderDash: [6, 4],

  };
}

function drawForeignFlow(f) {
  const ctx = document.getElementById("foreignFlowChart");
  const series = f && typeof f.series === "object" ? f.series : null;
  if (!ctx || !series) return;
  const rawDates = Array.isArray(series.dates) ? series.dates : [];
  const rawNet = Array.isArray(series.net_shares) ? series.net_shares : [];
  const rawRatio = Array.isArray(series.holding_ratio_pct) ? series.holding_ratio_pct : [];
  const count = Math.min(rawDates.length, rawNet.length);
  if (!count) return;
  const dates = rawDates.slice(0, count).map(v => String(v ?? "—"));
  const net = rawNet.slice(0, count).map(finiteNumber);
  const ratio = dates.map((_, i) => finiteNumber(rawRatio[i]));
  const ratioVals = ratio.filter(v => v !== null);
  const barColors = net.map(v => v > 0 ? "rgba(248,113,113,.78)"
                                       : v < 0 ? "rgba(52,211,153,.72)"
                                               : "rgba(107,114,128,.55)");
  const opts = baseOpts(undefined, undefined);
  opts.scales.y.title = {
    display: true, text: "外资净买卖（股）", color: "#9aa3b2", font: {size: 11},
  };
  opts.scales.y.ticks.callback = v => {
    const a = Math.abs(v);
    if (a >= 1000000) return (v / 1000000).toFixed(1) + "百万";
    if (a >= 10000) return (v / 10000).toFixed(0) + "万";
    return v;
  };
  opts.scales.y1 = {
    position: "right",
    min: ratioVals.length ? Math.floor((Math.min(...ratioVals) - .15) * 10) / 10 : undefined,
    max: ratioVals.length ? Math.ceil((Math.max(...ratioVals) + .15) * 10) / 10 : undefined,
    ticks: { color: "#fbbf24", callback: v => Number(v).toFixed(1) + "%" },
    grid: { drawOnChartArea: false },
    title: { display: true, text: "外资持股比例", color: "#fbbf24", font: {size: 11} },
  };
  opts.plugins.tooltip.callbacks = {
    label: c => {
      const raw = finiteNumber(c.raw);
      return c.dataset.yAxisID === "y1"
        ? `${c.dataset.label}: ${raw === null ? "—" : raw.toFixed(2) + "%"}`
        : `${c.dataset.label}: ${fmtSignedShares(raw)}`;
    },
  };
  charts.push(new Chart(ctx, {
    type: "bar",
    data: {
      labels: dates,
      datasets: [
        {
          label: String(f.market || "").toUpperCase() === "ALL"
            ? "外资净买卖（ALL）" : "外资净买卖",
          data: net,
          backgroundColor: barColors,
          borderWidth: 0,
          borderRadius: 2,
          yAxisID: "y",
          order: 2,
        },
        {
          type: "line",
          label: "外资持股比例",
          data: ratio,
          borderColor: "#fbbf24",
          backgroundColor: "#fbbf24",
          pointRadius: 0,
          borderWidth: 1.6,
          tension: .2,
          spanGaps: true,
          yAxisID: "y1",
          order: 1,
        },
      ],
    },
    options: opts,
  }));
}

  const colors = vals.map(v => v >= 80 ? "#f87171" : v >= 70 ? "#fb923c" : v >= 55 ? "#fbbf24" : "#60a5fa");
  const datasets = [
    { label: "TCI", data: vals, borderColor: "#fb923c", backgroundColor: "rgba(251,146,60,.08)",
      fill: true, pointRadius: 0, borderWidth: 1.8, tension: .2, segment: {
        borderColor: c => colors[c.p1DataIndex],
      }},
    { label: "红区 80", data: vals.map(() => 80), borderColor: "rgba(248,113,113,.6)",
      borderWidth: 1, borderDash: [6,4], pointRadius: 0, fill: false },
    { label: "黄区 55", data: vals.map(() => 55), borderColor: "rgba(251,191,36,.45)",
      borderWidth: 1, borderDash: [6,4], pointRadius: 0, fill: false },
  ];
  // 各标的价格曲线(起点归一化=100, 右轴), 默认隐藏, 点图例开启
  const prices = t.chart.prices || {};
  const hasPrices = Object.keys(prices).length > 0;
  for (const k of Object.keys(prices)) {
    datasets.push({
      label: (STOCK_LABELS[k] || k) + " 价格", data: prices[k], yAxisID: "y1", hidden: true,
      borderColor: STOCK_COLORS[k] || "#999", pointRadius: 0, borderWidth: 1.3,
      tension: .2, spanGaps: true, fill: false,

  const opts = baseOpts(0, 100);
  if (hasPrices) {
    // 对数轴: SNDK等标的一年涨幅达数十倍, 线性轴会压扁其他曲线
    opts.scales.y1 = {
      type: "logarithmic", position: "right",

      title: { display: true, text: "价格(起点=100, 对数轴)", color: "#6b7280", font: {size: 11} },
    };

  charts.push(new Chart(ctx, {
    type: "line",
    data: { labels: t.chart.dates, datasets },
    options: opts,
  }));
}

function drawIvTerm(options) {
  const ctx = document.getElementById("ivTermChart");
  const withTs = options.filter(o => (o.term_structure || []).length);
  if (!ctx || !withTs.length) return;
  // 各标的的到期日并集作为x轴
  const expSet = new Set();
  const expDte = new Map();
  withTs.forEach(o => o.term_structure.forEach(p => { expSet.add(p.exp); expDte.set(p.exp, p.dte); }));
  const exps = [...expSet].sort();
  const labels = exps.map(e => e.slice(2).replace(/-/g, "/"));
  const maps = withTs.map(o => new Map(o.term_structure.map(p => [p.exp, p.iv_pct])));
  const ds = withTs.map((o, i) => ({
    label: STOCK_LABELS[o.ticker] || o.ticker, data: exps.map(e => maps[i].get(e) ?? null),
    borderColor: STOCK_COLORS[o.ticker] || "#999",
    pointBackgroundColor: STOCK_COLORS[o.ticker] || "#999",
    pointRadius: 2, pointHoverRadius: 4,
    borderWidth: 1.1, tension: .2, spanGaps: true, fill: false,
  }));
  // 合成IV: 各到期日可得标的的均值(至少2个)
  const comp = exps.map(e => {
    const vals = maps.map(m => m.get(e)).filter(v => v != null);
    return vals.length >= 2 ? +(vals.reduce((a, b) => a + b) / vals.length).toFixed(1) : null;
  });
  if (comp.some(v => v !== null)) {
    ds.unshift({
      label: "合成IV(均值)", data: comp,
      borderColor: "#e8eaf0", pointBackgroundColor: "#e8eaf0",
      pointRadius: 3, pointHoverRadius: 5, borderWidth: 2.4,
      tension: .2, spanGaps: true, fill: false,
    });
  }
  // 增速: 合成IV沿到期日方向的斜率(pp/天), 负=倒挂(近月恐慌); 跳过合成为空的到期日
  const slope = exps.map(() => null);
  let prev = -1;
  for (let i = 0; i < exps.length; i++) {
    if (comp[i] == null) continue;
    if (prev >= 0) {
      const dd = (expDte.get(exps[i]) ?? 0) - (expDte.get(exps[prev]) ?? 0);
      if (dd > 0) slope[i] = +((comp[i] - comp[prev]) / dd).toFixed(2);
    }
    prev = i;
  }
  const hasSlope = slope.some(v => v !== null);
  if (hasSlope) {
    ds.push({
      type: "bar", label: "合成IV增速(pp/天)", data: slope, yAxisID: "y1",
      backgroundColor: slope.map(v =>
        v < 0 ? "rgba(248,113,113,.65)" : v > 0 ? "rgba(52,211,153,.6)" : "rgba(107,114,128,.5)"),
      borderWidth: 0, borderRadius: 2, order: 3,
    });
  }
  const opts = baseOpts(undefined, undefined);
  if (hasSlope) {
    opts.scales.y1 = {
      position: "right", grid: { drawOnChartArea: false },
      ticks: { color: "#6b7280" },
      title: { display: true, text: "增速 (pp/天, 红=倒挂)", color: "#6b7280", font: {size: 11} },
    };
  }
  opts.plugins.title = { display: true, text: "ATM IV期限结构 (年化%, 按到期日)", color: "#9aa3b2", font: {size: 12} };
  charts.push(new Chart(ctx, { type: "line", data: { labels, datasets: ds }, options: opts }));
}

function drawIvHist(ivc) {

  // 积累初期数据点少且无连线, 点要画大且实心填充(Chart.js默认点填充近乎透明)
  const few = ivc.dates.length < 8;
  const ds = Object.keys(ivc.series).map(k => ({
    label: STOCK_LABELS[k] || k, data: ivc.series[k],
    borderColor: STOCK_COLORS[k] || "#999", pointBackgroundColor: STOCK_COLORS[k] || "#999",
    pointRadius: few ? 4 : 2, pointHoverRadius: few ? 6 : 4,
    borderWidth: 1.1, tension: .2, spanGaps: true, fill: false,
  }));
  // 合成IV(四标的均值): 白色粗线, 放最前
  if ((ivc.composite || []).some(v => v !== null)) {
    ds.unshift({
      label: "合成IV(四标均值)", data: ivc.composite,
      borderColor: "#e8eaf0", pointBackgroundColor: "#e8eaf0",
      pointRadius: few ? 5 : 3, pointHoverRadius: few ? 7 : 5, borderWidth: 2.4,
      tension: .2, spanGaps: true, fill: false,
    });
  }
  // IV增速: 合成IV日变化(百分点), 右轴柱状
  const hasGrowth = (ivc.growth || []).some(v => v !== null);
  if (hasGrowth) {
    ds.push({
      type: "bar", label: "IV增速(pp/日)", data: ivc.growth, yAxisID: "y1",
      backgroundColor: ivc.growth.map(v =>
        v > 0 ? "rgba(248,113,113,.65)" : v < 0 ? "rgba(52,211,153,.6)" : "rgba(107,114,128,.5)"),
      borderWidth: 0, borderRadius: 2, order: 3,
    });
  }
  const opts = baseOpts(undefined, undefined);
  opts.scales.y.grace = "10%";  // 防止单点贴边被裁切
  if (hasGrowth) {
    opts.scales.y1 = {
      position: "right", grid: { drawOnChartArea: false },
      ticks: { color: "#6b7280" },
      title: { display: true, text: "IV增速 (pp/日)", color: "#6b7280", font: {size: 11} },
    };
  }
  opts.plugins.title = { display: true,
    text: `近月ATM IV历史 (年化%) · 已积累${ivc.dates.length}个交易日`,
    color: "#9aa3b2", font: {size: 12} };
  charts.push(new Chart(ctx, { type: "line", data: { labels: ivc.dates, datasets: ds }, options: opts }));
}

function baseOpts(min, max) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { labels: { color: "#9aa3b2", boxWidth: 18, boxHeight: 2 } },
      tooltip: { backgroundColor: "#1d212b", borderColor: "#2a2f3a", borderWidth: 1 },
    },
    scales: {
      x: { ticks: { color: "#6b7280", maxTicksLimit: 14, maxRotation: 0 }, grid: { color: "rgba(42,47,58,.5)" } },
      y: { min, max, ticks: { color: "#6b7280" }, grid: { color: "rgba(42,47,58,.5)" } },
    },
  };
}

async function doRefresh() {
  if (IS_STATIC) { location.reload(); return; }  // 静态站点由GitHub Actions定时更新
  const btn = document.getElementById("btnRefresh");
  btn.disabled = true; btn.textContent = "刷新中…";
  await fetch("/api/refresh", { method: "POST" });
  setTimeout(load, 5000);
}

load();
</script>
